name: api

image:
  tag: "d5f8a3e"   # set by CI

ingress:
  enabled: true
  subdomain: api
  # Public API surface. /metrics, /healthz and /readyz stay cluster-internal.
  paths:
    - /orders
    - /version
    - /burn
    - /openapi.yaml

rollout:
  enabled: true

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

database:
  enabled: true

aws:
  queue: true

env:
  # Demo lever: a non-zero value turns this release into a "bad" canary.
  FAULT_RATE: "0"

resources:
  requests: { cpu: 250m, memory: 64Mi }
  limits: { memory: 128Mi }
