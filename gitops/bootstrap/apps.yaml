# One Application per directory under gitops/apps/, rendered from the shared service chart.
# The cluster must carry egp.io/data-layer=ready (set by Terraform 30-data), so apps only
# appear once their queue, bucket and database exist.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  egp.io/data-layer: ready
          - git:
              repoURL: https://github.com/bulbashenko/eks-gitops-platform.git
              revision: main
              directories:
                - path: gitops/apps/*
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: apps
      sources:
        - repoURL: '{{ index .metadata.annotations "gitops_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
          path: gitops/charts/service
          helm:
            releaseName: "{{ .path.basename }}"
            valueFiles:
              - "$values/gitops/apps/{{ .path.basename }}/values.yaml"
            valuesObject:
              image:
                registry: '{{ index .metadata.annotations "aws_account_id" }}.dkr.ecr.{{ index .metadata.annotations "aws_region" }}.amazonaws.com'
              platform:
                region: '{{ index .metadata.annotations "aws_region" }}'
                domain: '{{ index .metadata.annotations "domain" }}'
                vpcCidr: '{{ index .metadata.annotations "vpc_cidr" }}'
                albGroupName: '{{ index .metadata.annotations "alb_group_name" }}'
                certificateArn: '{{ index .metadata.annotations "acm_certificate_arn" }}'
                ordersQueueUrl: '{{ index .metadata.annotations "orders_queue_url" }}'
                receiptsBucket: '{{ index .metadata.annotations "receipts_bucket" }}'
                dbHost: '{{ index .metadata.annotations "db_host" }}'
                dbPort: '{{ index .metadata.annotations "db_port" }}'
                dbName: '{{ index .metadata.annotations "db_name" }}'
                dbMasterSecretArn: '{{ index .metadata.annotations "db_master_secret_arn" }}'
        - repoURL: '{{ index .metadata.annotations "gitops_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: orders
      # Argo Rollouts owns these fields at runtime (canary selectors, ALB weights).
      ignoreDifferences:
        - group: ""
          kind: Service
          jqPathExpressions:
            - '.spec.selector["rollouts-pod-template-hash"]'
        - group: networking.k8s.io
          kind: Ingress
          jqPathExpressions:
            - '.metadata.annotations["alb.ingress.kubernetes.io/actions.{{ .path.basename }}-stable"]'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
