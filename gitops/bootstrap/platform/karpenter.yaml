# Karpenter controller (runs on the system node group) and its NodePools, which are a
# separate app so capacity policy can change without touching the controller.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: karpenter
    spec:
      project: platform
      source:
        repoURL: public.ecr.aws/karpenter
        chart: karpenter
        targetRevision: 1.14.1
        helm:
          releaseName: karpenter
          valuesObject:
            settings:
              clusterName: '{{ index .metadata.annotations "cluster_name" }}'
              clusterEndpoint: '{{ index .metadata.annotations "cluster_endpoint" }}'
              interruptionQueue: '{{ index .metadata.annotations "karpenter_queue_name" }}'
            serviceAccount:
              name: karpenter
            replicas: 1
            dnsPolicy: Default
            nodeSelector: { node-role.egp.io/system: "true" }
            controller:
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 512Mi }
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-nodepools
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: karpenter-nodepools
    spec:
      project: platform
      source:
        repoURL: '{{ index .metadata.annotations "gitops_repo_url" }}'
        targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
        path: gitops/platform/karpenter-nodepools
        helm:
          valuesObject:
            clusterName: '{{ index .metadata.annotations "cluster_name" }}'
            nodeRoleName: '{{ index .metadata.annotations "karpenter_node_role_name" }}'
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
