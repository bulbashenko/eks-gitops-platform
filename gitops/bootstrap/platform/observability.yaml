# Metrics (Prometheus), dashboards (Grafana), logs (Loki, collected by Alloy).
# The environment is ephemeral, so nothing uses persistent volumes (ADR-0009).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: kube-prometheus-stack
    spec:
      project: platform
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 91.8.2
        helm:
          releaseName: kube-prometheus-stack
          valuesObject:
            # EKS runs the control plane; these components cannot be scraped.
            kubeControllerManager: { enabled: false }
            kubeScheduler: { enabled: false }
            kubeEtcd: { enabled: false }
            kubeProxy: { enabled: false }
            # Export node labels so dashboards can split capacity by Spot/On-Demand.
            kube-state-metrics:
              metricLabelsAllowlist:
                - nodes=[karpenter.sh/capacity-type,node.kubernetes.io/instance-type,kubernetes.io/arch]
            prometheus:
              prometheusSpec:
                retention: 24h
                # Pick up ServiceMonitors/PodMonitors/rules from every namespace and chart.
                serviceMonitorSelectorNilUsesHelmValues: false
                podMonitorSelectorNilUsesHelmValues: false
                ruleSelectorNilUsesHelmValues: false
                probeSelectorNilUsesHelmValues: false
                resources:
                  requests: { cpu: 200m, memory: 768Mi }
                  limits: { memory: 2Gi }
            alertmanager:
              alertmanagerSpec:
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 128Mi }
            grafana:
              admin:
                existingSecret: grafana-admin
                userKey: username
                passwordKey: password
              serviceAccount:
                name: kube-prometheus-stack-grafana
              ingress:
                enabled: true
                ingressClassName: alb
                hosts: ['grafana.{{ index .metadata.annotations "domain" }}']
                annotations:
                  alb.ingress.kubernetes.io/group.name: '{{ index .metadata.annotations "alb_group_name" }}'
                  alb.ingress.kubernetes.io/scheme: internet-facing
                  alb.ingress.kubernetes.io/target-type: ip
                  alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
                  alb.ingress.kubernetes.io/ssl-redirect: "443"
                  alb.ingress.kubernetes.io/certificate-arn: '{{ index .metadata.annotations "acm_certificate_arn" }}'
                  alb.ingress.kubernetes.io/healthcheck-path: /api/health
                  alb.ingress.kubernetes.io/conditions.kube-prometheus-stack-grafana: '{{ index .metadata.annotations "ui_source_ip_condition" }}'
              grafana.ini:
                # Grafana's CloudWatch data source uses the Pod Identity credentials.
                aws:
                  allowed_auth_providers: default
                  assume_role_enabled: false
              sidecar:
                dashboards:
                  enabled: true
                  searchNamespace: ALL
                  label: grafana_dashboard
                  folderAnnotation: grafana_folder
                  provider:
                    foldersFromFilesStructure: true
              additionalDataSources:
                - name: Loki
                  type: loki
                  uid: loki
                  url: http://loki.monitoring:3100
                - name: CloudWatch
                  type: cloudwatch
                  uid: cloudwatch
                  jsonData:
                    authType: default
                    defaultRegion: '{{ index .metadata.annotations "aws_region" }}'
              resources:
                requests: { cpu: 50m, memory: 192Mi }
                limits: { memory: 512Mi }
      destination:
        server: "{{ .server }}"
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: loki
    spec:
      project: platform
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: loki
        targetRevision: 7.3.0
        helm:
          releaseName: loki
          valuesObject:
            deploymentMode: SingleBinary
            loki:
              auth_enabled: false
              commonConfig:
                replication_factor: 1
              storage:
                type: filesystem
              schemaConfig:
                configs:
                  - from: "2025-01-01"
                    store: tsdb
                    object_store: filesystem
                    schema: v13
                    index: { prefix: index_, period: 24h }
              limits_config:
                retention_period: 24h
            singleBinary:
              replicas: 1
              persistence:
                enabled: false
              # Without a PVC the chart mounts nothing at /var/loki and the root FS is read-only.
              extraVolumes:
                - name: data
                  emptyDir: {}
              extraVolumeMounts:
                - name: data
                  mountPath: /var/loki
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 1Gi }
            read: { replicas: 0 }
            write: { replicas: 0 }
            backend: { replicas: 0 }
            gateway: { enabled: false }
            chunksCache: { enabled: false }
            resultsCache: { enabled: false }
            lokiCanary: { enabled: false }
            test: { enabled: false }
      destination:
        server: "{{ .server }}"
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alloy
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: alloy
    spec:
      project: platform
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: alloy
        targetRevision: 1.13.0
        helm:
          releaseName: alloy
          valuesObject:
            # One replica tails logs through the Kubernetes API: no host mounts, no privileges.
            controller:
              type: deployment
              replicas: 1
            alloy:
              configMap:
                content: |
                  discovery.kubernetes "pods" {
                    role = "pod"
                  }

                  discovery.relabel "pods" {
                    targets = discovery.kubernetes.pods.targets
                    rule {
                      source_labels = ["__meta_kubernetes_namespace"]
                      target_label  = "namespace"
                    }
                    rule {
                      source_labels = ["__meta_kubernetes_pod_name"]
                      target_label  = "pod"
                    }
                    rule {
                      source_labels = ["__meta_kubernetes_pod_container_name"]
                      target_label  = "container"
                    }
                    rule {
                      source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                      target_label  = "app"
                    }
                  }

                  loki.source.kubernetes "pods" {
                    targets    = discovery.relabel.pods.output
                    forward_to = [loki.process.json.receiver]
                  }

                  // Our services log JSON; promote the level to a label for fast filtering.
                  loki.process "json" {
                    stage.json {
                      expressions = { level = "level" }
                    }
                    stage.labels {
                      values = { level = "" }
                    }
                    forward_to = [loki.write.default.receiver]
                  }

                  loki.write "default" {
                    endpoint {
                      url = "http://loki.monitoring:3100/loki/api/v1/push"
                    }
                  }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 384Mi }
      destination:
        server: "{{ .server }}"
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
