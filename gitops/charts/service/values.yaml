# Defaults shared by every service. Per-service overrides live in gitops/apps/<name>/values.yaml
# (the image tag there is bumped by CI). `platform.*` is injected by the apps ApplicationSet
# from the GitOps Bridge annotations and must not be set by hand.

name: ""

image:
  # <account>.dkr.ecr.<region>.amazonaws.com; set from platform facts by the ApplicationSet.
  registry: ""
  repository: ""   # defaults to egp/<name>
  tag: ""

replicas: 2
containerPort: 8080

env: {}

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 128Mi }

service:
  enabled: true
  port: 80

ingress:
  enabled: false
  # Host prefix; the full host is <subdomain>.<platform.domain>.
  subdomain: ""

rollout:
  enabled: false
  # Canary steps. The background analysis runs from step 1 until promotion.
  steps:
    - setWeight: 20
    - pause: { duration: 2m }
    - setWeight: 50
    - pause: { duration: 2m }
  analysis:
    enabled: true
    # Abort if the canary's 5xx ratio exceeds this over a 1m window.
    maxErrorRate: 0.05
    interval: 30s

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 1

database:
  # Mount PG* credentials from the RDS-managed secret via External Secrets.
  enabled: false

aws:
  # Which platform facts to expose as environment variables.
  queue: false
  bucket: false

networkPolicy:
  enabled: true

platform:
  region: ""
  domain: ""
  vpcCidr: ""
  albGroupName: ""
  certificateArn: ""
  ordersQueueUrl: ""
  receiptsBucket: ""
  dbHost: ""
  dbPort: ""
  dbName: ""
  dbMasterSecretArn: ""
