# One store for the whole cluster. It authenticates with the External Secrets controller's
# Pod Identity, which may only read rds!* and egp/* secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region }}
---
# The Grafana admin password is generated in-cluster, once, by an ESO generator. It never
# exists in Terraform state, Secrets Manager or CI, so nothing outside the cluster can read it.
# (Its lifetime equals the environment's; retrieve it with kubectl, see the demo script.)
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  length: 24
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: "0"   # generate once; a new value on every refresh would lock the admin out
  target:
    name: grafana-admin
    template:
      data:
        username: admin
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin
