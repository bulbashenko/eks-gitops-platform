# One store for the whole cluster. It authenticates with the External Secrets controller's
# Pod Identity, which may only read rds!* and egp/* secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: {{ required "grafanaAdminSecret is required" .Values.grafanaAdminSecret }}
