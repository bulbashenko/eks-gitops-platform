# Admission policies. Cluster-wide rules skip the namespaces of EKS-managed and platform
# components that legitimately need host access; application rules apply to `orders`.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Privileged containers can escape to the node.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, monitoring]
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest tag
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Mutable tags make deployments unreproducible and rollbacks meaningless.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-explicit-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system]
      validate:
        message: "Images must use an explicit, immutable tag (not ':latest' or no tag)."
        foreach:
          - list: "request.object.spec.[containers, initContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ contains(element.image, ':') }}"
                    operator: Equals
                    value: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-app-images-to-ecr
  annotations:
    policies.kyverno.io/title: Application images come from our ECR
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Only images built by our CI (scanned by Trivy, pushed to our ECR) may run as applications.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: ecr-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [orders]
      validate:
        message: "Images in 'orders' must come from this account's ECR (…dkr.ecr.<region>.amazonaws.com/egp/…)."
        pattern:
          spec:
            =(initContainers):
              - image: "*.dkr.ecr.*.amazonaws.com/egp/*"
            containers:
              - image: "*.dkr.ecr.*.amazonaws.com/egp/*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-app-pod-hardening
  annotations:
    policies.kyverno.io/title: Application pods are non-root, read-only and resource-bounded
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: non-root-read-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [orders]
      validate:
        message: "Containers must set runAsNonRoot: true, readOnlyRootFilesystem: true and allowPrivilegeEscalation: false."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
    - name: requests-and-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [orders]
      validate:
        message: "Containers must declare CPU/memory requests and a memory limit."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
