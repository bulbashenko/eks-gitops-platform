# Admission policies as Kyverno ValidatingPolicy (CEL, policies.kyverno.io/v1), the successor
# of the deprecated kyverno.io/v1 ClusterPolicy. They use the same expression language as the
# built-in Kubernetes ValidatingAdmissionPolicy. Cluster-wide rules skip the namespaces of
# EKS-managed and platform components that legitimately need host access; application rules
# apply to `orders` only.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Privileged containers can escape to the node.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, monitoring]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
      message: Privileged containers are not allowed.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Mutable tags make deployments unreproducible and rollbacks meaningless.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    # A digest pins the image. Otherwise the last path segment must carry a tag other than
    # latest (the registry host may contain a ':port', so the whole string is not enough).
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@sha256:') ||
          (c.image.split('/')[size(c.image.split('/')) - 1].contains(':') && !c.image.endsWith(':latest')))
      message: "Images must use an explicit, immutable tag (not ':latest' or no tag)."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-app-images-to-ecr
  annotations:
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Only images built by our CI (scanned by Trivy, pushed to our ECR) may run as applications.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: orders
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.matches('^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/egp/'))
      message: "Images in 'orders' must come from this account's ECR (<account>.dkr.ecr.<region>.amazonaws.com/egp/...)."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-app-pod-hardening
  annotations:
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Application pods are non-root, read-only and resource-bounded.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: orders
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot &&
          has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
          has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation)
      message: "Containers must set runAsNonRoot: true, readOnlyRootFilesystem: true and allowPrivilegeEscalation: false."
    - expression: >-
        object.spec.containers.all(c, has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "Containers must declare CPU/memory requests and a memory limit."
